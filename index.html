<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Billing System</title>
</head>

<body>

    <h1>Billing System</h1>

    <section>

        <h2>Add Product</h2>

        <label for="productName">Product Name:</label>
        <input type="text" id="productName">

        <br><br>

        <label>Pricing Type:</label>

        <input type="radio" id="unit" name="pricingType" value="unit">
        <label for="unit">Price per Unit</label>

        <input type="radio" id="kg" name="pricingType" value="kg">
        <label for="kg">Price per Kg</label>

        <br><br>

        <label for="quantity">Quantity / Weight:</label>
        <input type="number" id="quantity" min="0" step="0.01">

        <br><br>

        <label for="price">Price:</label>
        <input type="number" id="price" min="0" step="0.01">

        <br><br>

        <button id="addProduct">Add Product</button>

    </section>

</body>
</html>
